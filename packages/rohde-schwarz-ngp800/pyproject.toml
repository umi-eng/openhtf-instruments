[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rohde_schwarz_ngp800"]

[project]
name = "openhtf-plug-rohde-schwarz-ngp800"
version = "0.1.0"
description = "OpenHTF SCPI plug for the Rohde & Schwarz NGP800 power supply series"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["openhtf>=1.6.1", "pyvisa>=1.16.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["adcmt_ad7461a"]

[project]
name = "openhtf-plug-adcmt-ad7461a"
version = "0.1.0"
description = "OpenHTF PyVISA SCPI plug for the ADCMT AD7461A digital multimeter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["openhtf>=1.6.1", "pyvisa>=1.16.2"]

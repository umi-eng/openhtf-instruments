[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["heraeus_voetsch_vrsu"]

[project]
name = "openhtf-plug-heraeus-voetsch-vrsu"
version = "0.1.0"
description = "OpenHTF plug for the Heraeus Voetsch VRSU IEEE-488/RS-232 interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["openhtf>=1.6.1", "pyvisa>=1.16.2"]

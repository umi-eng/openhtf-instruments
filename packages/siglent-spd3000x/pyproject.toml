[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["siglent_spd3000x"]

[project]
name = "openhtf-plug-siglent-spd3000x"
version = "0.1.0"
description = "OpenHTF PyVISA plug for Siglent SPD3000X series programmable DC power supplies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["openhtf>=1.6.1", "pyvisa>=1.16.2"]

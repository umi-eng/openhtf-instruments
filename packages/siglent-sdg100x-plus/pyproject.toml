[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["siglent_sdg100x_plus"]

[project]
name = "openhtf-plug-siglent-sdg100x-plus"
version = "0.1.0"
description = "OpenHTF PyVISA plug for Siglent SDG1000X Plus waveform generators"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["openhtf>=1.6.1", "pyvisa>=1.16.2"]
